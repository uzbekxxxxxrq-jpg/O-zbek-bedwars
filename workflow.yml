<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bedwars 3D Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      font-family: 'Courier New', Courier, monospace;
      background-color: #0f172a;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1b4b;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .loader {
      border: 6px solid #312e81;
      border-top: 6px solid #4f46e5;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #main-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 900;
    }
    #main-menu h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #38bdf8;
      text-shadow: 2px 2px #0369a1;
    }
    #start-btn {
      padding: 15px 40px;
      font-size: 1.25rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px #0369a1;
      transition: 0.1s;
    }
    #start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 #0369a1;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Loading Ekrani -->
  <div id="loading-screen">
    <div class="loader"></div>
    <h2 style="font-size: 1.5rem; font-weight: bold;">Bedwars yuklanmoqda...</h2>
  </div>

  <!-- Kirish Menyusi -->
  <div id="main-menu" class="hidden">
    <h1>BEDWARS 3D</h1>
    <button id="start-btn" onclick="startGame()">O'YINGA KIRISH</button>
  </div>

  <!-- O'yin Asosiy Qismi -->
  <div id="game-container" class="w-full h-full"></div>

  <script>
    // Loading va menyu boshqaruvi
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
      }, 1500);
    });

    function startGame() {
      document.getElementById('main-menu').classList.add('hidden');
      initGameEngine(); // Asosiy o'yin funksiyalarini ishga tushirish
    }

    // --- O'YINNING ASOSIY KODI (Fizika, Botlar, Xarita va Inventar) ---
    function initGameEngine() {
      const container = document.getElementById('game-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Yorug'lik va xarita
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      camera.position.set(0, 5, 10);

      // Render sikli
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      // Ekran o'lchami o'zgarganda
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
